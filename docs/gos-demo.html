<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOS Demo</title>
<meta name="description" content="Clickable demo of GOS: the gym admin and the member app, with sample data. Nothing is saved.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* GOS demo: one file, no server. The admin (left) and the member app (right)
   share one in-memory state, so an action on one side shows up on the other. */
:root {
  --page: #eef0e8; --bg: #f7f8f3; --surface: #ffffff; --border: #e4e7dc; --text: #18181b; --muted: #6b7068;
  --brand: #65a30d; --brand-fg: #ffffff; --accent: #c8f04b; --accent-fg: #1a2e05; --hero: #1f2a10; --hero-text: #fff; --hero-muted: #c3cdb2;
  --danger: #dc2626; --good: #15803d; --good-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7; --bad-bg: #fee2e2;
  --usp: #f59e0b; --usp-bg: #fff7e0; --usp-fg: #7a4a00;
  --t-blue-bg: #e2f3fb; --t-blue: #3d84a8; --t-green-bg: #e7f7e3; --t-green: #4f9a57; --t-pink-bg: #f9e4f1; --t-pink: #b85d98; --t-yellow-bg: #fbf5d8; --t-yellow: #a08a1c;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
svg.i { width: 1em; height: 1em; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Top bar --------------------------------------------------------------- */
.top { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 20px; background: var(--hero); color: #fff; }
.top .logo { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
.top .logo b { color: var(--accent); }
.top .tag { color: var(--hero-muted); font-size: 12.5px; flex: 1; min-width: 200px; }
.seg { display: inline-flex; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px; }
.seg button { padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: #e6ecd9; }
.seg button.on { background: var(--accent); color: var(--accent-fg); }
.tbtn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.1); color: #fff; }
.tbtn:hover { background: rgba(255,255,255,.18); }
.tbtn.usp-btn { background: var(--usp); color: #3b2500; }
.switch-usp { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: #fff; }

/* Stage ------------------------------------------------------------------ */
.stage { display: flex; gap: 24px; justify-content: center; align-items: flex-start; padding: 20px 16px 120px; flex-wrap: wrap; }
body[data-view="admin"] .phone-wrap, body[data-view="app"] .col { display: none; }
.browser { flex: 1 1 760px; max-width: 1180px; min-width: 0; background: var(--surface); border-radius: 14px; box-shadow: 0 20px 50px -20px rgba(31,42,16,.35), 0 0 0 1px rgba(0,0,0,.06); overflow: hidden; position: relative; }
.chrome { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: #eceee6; border-bottom: 1px solid var(--border); }
.dots { display: flex; gap: 6px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: #d4d7cc; display: block; }
.dots i:nth-child(1) { background: #f87171; } .dots i:nth-child(2) { background: #fbbf24; } .dots i:nth-child(3) { background: #4ade80; }
.url { flex: 1; background: #fff; border-radius: 8px; padding: 5px 12px; font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.url b { color: var(--text); font-weight: 500; }
#admin { height: min(820px, calc(100vh - 120px)); min-height: 620px; position: relative; }
.phone-wrap { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.phone-label, .browser-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.col { display: flex; flex-direction: column; gap: 10px; flex: 1 1 760px; max-width: 1180px; min-width: 0; }
.col .browser { flex: none; max-width: none; }
.phone { width: 390px; height: 820px; border-radius: 52px; background: #111; padding: 12px; box-shadow: 0 30px 60px -25px rgba(0,0,0,.5); position: relative; }
.phone .notch { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; background: #000; border-radius: 20px; z-index: 30; }
#app { width: 100%; height: 100%; border-radius: 41px; overflow: hidden; position: relative; background: var(--p-bg); color: var(--p-text); display: flex; flex-direction: column; }
@media (max-width: 440px) { .phone { width: calc(100vw - 24px); height: 760px; border-radius: 40px; padding: 8px; } #app { border-radius: 33px; } }

/* USP marks -------------------------------------------------------------- */
.usp { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 800; letter-spacing: .3px; color: var(--usp-fg); background: var(--usp-bg); border: 1px solid #fcd581; border-radius: 999px; padding: 1px 7px 1px 6px; white-space: nowrap; vertical-align: middle; cursor: help; text-transform: uppercase; }
.usp svg.i { width: 10px; height: 10px; fill: var(--usp); stroke: var(--usp); }
body.usp-on .uz { outline: 2.5px dashed var(--usp); outline-offset: 3px; border-radius: 14px; animation: glow 2.4s ease-in-out infinite; }
@keyframes glow { 50% { outline-color: #fbbf24aa; } }
@media (prefers-reduced-motion: reduce) { body.usp-on .uz { animation: none; } }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--usp); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* USP drawer + guide ------------------------------------------------------ */
.drawer { position: fixed; right: 16px; top: 64px; width: 380px; max-width: calc(100vw - 32px); max-height: calc(100vh - 90px); overflow: auto; background: #fff; border-radius: 18px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.06); z-index: 60; padding: 18px; display: none; }
.drawer.open { display: block; }
.drawer h3 { margin: 0 0 4px; font-size: 17px; }
.drawer p.sub { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
.usp-item { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); }
.usp-item .n { width: 28px; height: 28px; border-radius: 50%; background: var(--usp-bg); color: var(--usp-fg); font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 13px; border: 1px solid #fcd581; }
.usp-item b { display: block; font-size: 13.5px; }
.usp-item span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.usp-item .vs { font-size: 11.5px; margin-top: 4px; color: #8a5a00; }
.usp-item button { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--brand); display: inline-flex; align-items: center; gap: 4px; }
.pitch { background: var(--hero); color: #fff; border-radius: 14px; padding: 12px 14px; font-size: 12.5px; margin-bottom: 8px; }
.pitch b { color: var(--accent); }
.guide { position: fixed; left: 16px; bottom: 16px; z-index: 55; width: auto; max-width: calc(100vw - 32px); background: #fff; border-radius: 18px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.06); }
.guide.open { width: 330px; }
.guide header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
.guide ol { margin: 0; padding: 0 14px 12px; list-style: none; counter-reset: s; display: none; }
.guide.open ol { display: block; }
.guide li { counter-increment: s; }
.guide li button { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; padding: 8px; border-radius: 10px; font-size: 12.5px; }
.guide li button:hover { background: var(--bg); }
.guide li button::before { content: counter(s); flex: 0 0 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 11px; }
.guide li small { display: block; color: var(--muted); }

/* Toasts ------------------------------------------------------------------ */
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: #18181b; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); display: flex; gap: 8px; align-items: center; animation: tin .25s ease-out; max-width: 90vw; }
.toast .i { color: var(--accent); }
.toast.from-app::before, .toast.from-admin::before { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; }
.toast.from-app::before { content: "APP"; background: var(--accent); color: var(--accent-fg); }
.toast.from-admin::before { content: "ADMIN"; background: #e5e7eb; color: #111; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }

/* ===================== ADMIN ===================== */
.a-app { display: flex; height: 100%; background: var(--bg); }
.a-side { width: 214px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; overflow: auto; }
.a-side .brand { font-weight: 800; font-size: 18px; padding: 4px 10px 14px; }
.a-side .brand b { color: var(--brand); }
.a-nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: #3f3f46; font-size: 13.5px; width: 100%; text-align: left; }
.a-nav:hover { background: #f1f3eb; }
.a-nav.on { background: #e8f2d6; color: #1a2e05; font-weight: 600; }
.a-nav .cnt { margin-left: auto; background: var(--danger); color: #fff; font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 1px 6px; }
.a-nav .off { margin-left: auto; font-size: 10px; color: var(--muted); }
.a-side .sep { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 12px 10px 4px; }
.a-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.a-head { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 22px; background: rgba(255,255,255,.9); border-bottom: 1px solid var(--border); }
.a-head .gym { display: flex; align-items: center; gap: 10px; font-weight: 600; flex: 1; min-width: 0; }
.gym-logo { width: 32px; height: 32px; border-radius: 9px; background: var(--hero); color: var(--accent); font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.a-icon-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 19px; }
.a-icon-btn:hover { background: #f1f3eb; }
.a-icon-btn .badge { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
.a-user { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; padding: 4px 8px 4px 4px; border-radius: 999px; }
.a-user:hover { background: #f1f3eb; }
.a-content { flex: 1; overflow: auto; padding: 22px 26px 40px; }
.a-pop { position: absolute; top: 52px; right: 70px; width: 320px; background: #fff; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 20px 40px -15px rgba(0,0,0,.3); z-index: 20; padding: 8px; }
.a-pop .row { display: flex; gap: 10px; padding: 10px; border-radius: 10px; font-size: 13px; width: 100%; text-align: left; align-items: center; }
.a-pop .row:hover { background: var(--bg); }
.a-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.a-title h1 { font-size: 22px; margin: 0; letter-spacing: -.3px; display: flex; align-items: center; gap: 10px; }
.a-title p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.a-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
.a-card h2 { font-size: 15px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.a-card .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .g-main, .g3 { grid-template-columns: minmax(0,1fr); } }
.stat .lbl { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat .val { font-size: 26px; font-weight: 700; margin-top: 4px; letter-spacing: -.5px; }
.stat .sub { font-size: 12px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; background: var(--brand); color: var(--brand-fg); white-space: nowrap; }
.btn:hover { filter: brightness(.95); }
.btn.sec { background: #fff; color: var(--text); border: 1px solid var(--border); }
.btn.sec:hover { background: #f4f5ef; filter: none; }
.btn.ghost { background: transparent; color: var(--text); }
.btn.ghost:hover { background: #f1f3eb; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.wa { background: #25d366; color: #073b1c; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inp, .sel, textarea.inp { width: 100%; border: 1px solid var(--border); background: #fff; border-radius: 10px; padding: 8px 11px; font-size: 13px; outline: none; }
.inp:focus, .sel:focus { border-color: var(--brand); box-shadow: 0 0 0 3px #65a30d22; }
label.f { display: block; font-size: 12.5px; font-weight: 500; margin-bottom: 10px; }
label.f > span { display: block; margin-bottom: 4px; }
label.f small { color: var(--muted); font-weight: 400; }
.b { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: #f1f2ec; color: #52525b; white-space: nowrap; }
.b.good { background: var(--good-bg); color: var(--good); } .b.warn { background: var(--warn-bg); color: var(--warn); } .b.bad { background: var(--bad-bg); color: var(--danger); } .b.info { background: var(--t-blue-bg); color: var(--t-blue); }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.t td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: #fafbf7; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { color: var(--muted); display: block; font-size: 12px; }
.av { border-radius: 50%; overflow: hidden; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; background: var(--brand); color: #fff; position: relative; }
.av img, .av svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 6px 12px; border-radius: 999px; font-size: 12.5px; border: 1px solid var(--border); background: #fff; font-weight: 500; }
.chip.on { background: var(--hero); color: #fff; border-color: var(--hero); }
.list > * + * { border-top: 1px solid var(--border); }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.li .grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.tabnum { font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); padding: 20px; font-size: 13px; }
.banner { border-radius: 14px; padding: 14px; display: flex; gap: 14px; align-items: center; }
.banner.ok { background: #ecfccb; border: 1px solid #bef264; }
.banner.warn { background: var(--warn-bg); border: 1px solid #fcd34d; }
.banner.bad { background: var(--bad-bg); border: 1px solid #fca5a5; }
.scan-box { aspect-ratio: 16/10; background: #0b0d08; border-radius: 14px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 12.5px; }
.scan-box .frame { position: absolute; width: 46%; aspect-ratio: 1; border: 3px solid var(--accent); border-radius: 18px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
.scan-box .line { position: absolute; width: 42%; height: 2px; background: var(--accent); animation: scan 2s ease-in-out infinite alternate; }
@keyframes scan { from { transform: translateY(-60px); } to { transform: translateY(60px); } }
.toggle { position: relative; width: 40px; height: 23px; flex-shrink: 0; }
.toggle input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 1; margin: 0; }
.toggle span { position: absolute; inset: 0; border-radius: 999px; background: #d4d7cc; transition: .15s; }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle input:checked + span { background: var(--brand); }
.toggle input:checked + span::after { transform: translateX(17px); }
.set-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--border); }
.set-row:first-of-type { border-top: 0; }
.set-row .grow { flex: 1; }
.set-row b { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.set-row small { color: var(--muted); display: block; font-size: 12px; }
.progress { height: 8px; border-radius: 999px; background: #eef0e6; overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
.a-modal-back { position: absolute; inset: 0; background: rgba(15,20,8,.45); display: flex; align-items: flex-start; justify-content: center; padding: 50px 16px; z-index: 40; overflow: auto; }
.a-modal { background: #fff; border-radius: 18px; width: min(540px, 100%); box-shadow: 0 30px 60px -20px rgba(0,0,0,.4); animation: tin .2s ease-out; }
.a-modal header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 700; }
.a-modal .body { padding: 18px; }
.bars { position: relative; display: flex; gap: 6px; align-items: flex-end; margin-bottom: 22px; }
.bar-col { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; }
.bar-col .bar { width: 64%; max-width: 26px; min-height: 2px; border-radius: 4px 4px 0 0; transition: filter .15s; }
.bar-col:hover .bar { filter: brightness(.85); }
.bar-col span { position: absolute; bottom: -19px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.bar-col .tip { position: absolute; bottom: calc(100% + 4px); background: #18181b; color: #fff; font-size: 11px; border-radius: 6px; padding: 3px 7px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .1s; z-index: 2; }
.bar-col:hover .tip { opacity: 1; }
.bars .target { position: absolute; left: 0; right: 0; border-top: 1.5px dashed #9ca3af; pointer-events: none; }
.bars .target b { position: absolute; right: 0; top: -16px; font-size: 10px; color: var(--muted); font-weight: 500; }
.poster { background: var(--hero); color: #fff; border-radius: 22px; padding: 26px; text-align: center; max-width: 360px; margin: 0 auto; }
.poster .qr { background: #fff; border-radius: 16px; padding: 14px; display: inline-block; margin: 14px 0; }
.receipt { max-width: 460px; margin: 0 auto; }
.receipt dl { margin: 12px 0 0; }
.receipt dl div { display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
.receipt dl div:first-child { border-top: 0; }
.receipt dt { color: var(--muted); }
.receipt dd { margin: 0; }
.receipt .amt { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--text); margin-top: 10px; padding-top: 12px; font-weight: 600; }
.receipt .amt strong { font-size: 24px; }
.wa-preview { background: #e7ffdb; border-radius: 12px; padding: 12px; font-size: 12.5px; white-space: pre-wrap; border: 1px solid #c4f1a8; }
.plan-day { border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.plan-day h4 { margin: 0 0 8px; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; }

const SKIN = ["#f1c7a3", "#d9a37e", "#b97f57", "#8d5a3b", "#e8b896"];
const HAIR = ["#1f1a17", "#3b2a20", "#5a3a24", "#2b2b2b", "#6b4423"];

function face(seed, female) {
  const h = hash(seed), skin = SKIN[h % 5], hair = HAIR[(h >> 3) % 5], bg = BG[(h >> 5) % 7], shirt = SHIRT[(h >> 7) % 6];
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" fill="${bg}"/>${female ? `<path d="M15 44c0-17 6-28 17-28s17 11 17 28v6H15z" fill="${hair}"/>` : ""}<path d="M9 64c2-12 11-18 23-18s21 6 23 18z" fill="${shirt}"/><rect x="27" y="38" width="10" height="9" rx="3" fill="${skin}"/><circle cx="32" cy="29" r="12" fill="${skin}"/>${female ? `<path d="M19 30c0-10 6-15 13-15s13 5 13 15c-3-5-8-8-13-8s-10 3-13 8z" fill="${hair}"/>` : `<path d="M20 27c0-8 5-12 12-12s12 4 12 12c-2-4-6-6-12-6s-10 2-12 6z" fill="${hair}"/>`}<circle cx="27.5" cy="30" r="1.4" fill="#1f1a17"/><circle cx="36.5" cy="30" r="1.4" fill="#1f1a17"/><path d="M28.5 35c2 1.6 5 1.6 7 0" stroke="#7a4a32" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>`;
}
function av(m, size = 36, extra = "") {
  const fs = Math.round(size * 0.36);
  if (!m) return `<span class="av" style="width:${size}px;height:${size}px;font-size:${fs}px">?</span>`;
  let inner = esc(initials(m.name));
  if (m.photo === "face") inner = face(m.id, m.f);
  else if (m.photo) inner = `<img src="${m.photo}" alt="">`;
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${fs}px;${m.photo ? "" : "background:" + (m.team ? "#1f2a10;color:#c8f04b" : "var(--brand)")}${extra}" aria-hidden="true">${inner}</span>`;
}
function qr(seed, px = 170) {
  let h = hash(seed) | 1; const N = 25;
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967296; };
  const inF = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
  let r = "";
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!inF(x, y) && rnd() < 0.5) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  const fd = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
  return `<svg viewBox="-1 -1 ${N + 2} ${N + 2}" width="${px}" height="${px}" shape-rendering="crispEdges" style="background:#fff;display:block" role="img" aria-label="QR code"><g fill="#141a04">${r}${fd(0, 0)}${fd(N - 7, 0)}${fd(0, N - 7)}</g></svg>`;
}
function ring(frac, size, stroke, color, track) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - f)}"/></svg>`;
}
/* One series of bars; the last bar (today) full colour, the rest lighter. */
function bars(values, labels, { h = 140, color = "#65a30d", fmt = (v) => v, target } = {}) {
  const max = Math.max(...values, target || 0) * 1.15 || 1, n = values.length;
  return `<div class="bars" style="height:${h}px" role="img" aria-label="${esc(labels.map((l, i) => l + " " + fmt(values[i])).join(", "))}">${values.map((v, i) => `<div class="bar-col"><div class="tip">${esc(labels[i])}: ${esc(fmt(v))}</div><div class="bar" style="height:${(v / max) * 100}%;background:${i === n - 1 ? color : color + "73"}"></div><span>${esc(labels[i])}</span></div>`).join("")}${target ? `<div class="target" style="bottom:${(target / max) * 100}%"><b>Target ${esc(fmt(target))}</b></div>` : ""}</div>`;
}

const M = (id) => S.members.find((m) => m.id === id);

function subsOf(id) { return S.subs.filter((s) => s.memberId === id && !s.cancelled).sort((a, b) => (a.start < b.start ? 1 : -1)); }
function mstate(id) {
  const subs = subsOf(id);
  const cur = subs.find((s) => s.start <= TODAY && s.end >= TODAY);
  if (cur) { const next = subs.find((s) => s.start > cur.end); return { kind: "active", cur, next, left: daysBetween(TODAY, cur.end) }; }
  const up = subs.find((s) => s.start > TODAY);
  if (up) return { kind: "upcoming", up };
  return subs.length ? { kind: "expired", last: subs[0] } : { kind: "none" };
}
function stateBadge(id) {
  const m = M(id);
  if (m?.status === "deleted") return `<span class="b">Deleted</span>`;
  if (m?.status === "inactive") return `<span class="b">Removed</span>`;
  const s = mstate(id);
  if (s.kind === "active") return !s.next && s.left <= S.gym.warnDays ? `<span class="b warn">Ends ${s.left === 0 ? "today" : s.left === 1 ? "tomorrow" : "in " + s.left + " days"}</span>` : `<span class="b good">Active</span>`;
  if (s.kind === "upcoming") return `<span class="b info">Starts ${fmtShort(s.up.start)}</span>`;
  if (s.kind === "expired") return `<span class="b bad">Expired ${fmtShort(s.last.end)}</span>`;
  return `<span class="b">No plan</span>`;
}
const todaysCheckins = () => S.checkins.filter((c) => ymd(new Date(c.at)) === TODAY).sort((a, b) => b.at - a.at);
const checkedInToday = (id) => todaysCheckins().find((c) => c.memberId === id);
const myPt = () => S.pt.find((p) => p.memberId === ME && p.end >= TODAY);
const trainerOf = (id) => S.pt.find((p) => p.memberId === id && p.end >= TODAY)?.trainer;
const nutritionOn = () => S.gym.f.nutrition && (S.gym.f.nutritionAll || !!myPt());
const fmtReceipt = (n) => (S.gym.receiptPrefix || "#") + n;
const pendingUpi = () => S.payments.filter((p) => p.status === "created");
const pendingJoins = () => S.members.filter((m) => m.status === "pending");
const expiring = () => membersOnly().filter((m) => { const s = mstate(m.id); return m.status === "active" && s.kind === "active" && !s.next && s.left <= S.gym.warnDays; });
const foodTotals = () => S.food.log.reduce((t, x) => ({ kcal: t.kcal + x.kcal, p: t.p + x.p }), { kcal: 0, p: 0 });
const gymOpenNow = () => !S.gym.simulateClosed;
const nextPlanDay = () => {
  const plan = S.wplans.find((w) => w.assigned.includes(ME));
  if (!plan) return null;
  const last = S.history.find((h) => plan.days.some((d) => d.label === h.label));
  const idx = last ? (plan.days.findIndex((d) => d.label === last.label) + 1) % plan.days.length : 0;
  return { plan, day: plan.days[idx], idx };
};

function memberTable() {
  const q = S.a.memQuery.trim().toLowerCase();
  let list = S.a.memFilter === "team" ? team() : membersOnly();
  list = list.filter((m) => {
    const s = mstate(m.id);
    if (S.a.memFilter === "active") return s.kind === "active" || s.kind === "upcoming";
    if (S.a.memFilter === "expiring") return s.kind === "active" && !s.next && s.left <= S.gym.warnDays;
    if (S.a.memFilter === "expired") return s.kind === "expired" || s.kind === "none";
    return true;
  }).filter((m) => !q || m.name.toLowerCase().includes(q) || (m.phone || "").replace(/\s/g, "").includes(q.replace(/\s/g, "")));

function recordPayment(memberId, planId, method, extra = {}) {
  const plan = S.plans.find((p) => p.id === planId);
  const s = mstate(memberId);
  const start = s.kind === "active" ? addDays((s.next || s.cur).end, 1) : TODAY;
  const sub = { id: uid("s"), memberId, plan: plan.name, planId, start, end: addDays(start, plan.days - 1), price: plan.price };
  S.subs.push(sub);
  const pay = { id: extra.id || uid("pay"), memberId, amount: plan.price, what: plan.name, kind: "plan", status: "paid", method, receipt: ++S.gym.receiptSeq, at: new Date(), utr: extra.utr || "", subId: sub.id };
  if (extra.id) Object.assign(S.payments.find((p) => p.id === extra.id), pay);
  else S.payments.unshift(pay);
  notify(memberId, { kind: "paid", title: `Payment received: ${inr(plan.price)}`, body: `${plan.name} · Receipt ${fmtReceipt(pay.receipt)}`, link: "receipt:" + pay.id });
  return pay;
}
function doCheckin(memberId, method) {
  const dup = checkedInToday(memberId);
  const s = mstate(memberId);
  const res = { memberId, at: dup ? dup.at : new Date(), dup: !!dup, ok: s.kind === "active", ends: s.kind === "active" ? s.cur.end : s.kind === "expired" ? s.last.end : null };
  if (!dup) S.checkins.push({ id: uid("c"), memberId, at: res.at, method });
  return res;
}
function download(name, text, type = "text/csv") {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const csv = (rows) => rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
function parseImport(text) {
  const months = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  const d = (s) => { s = (s || "").trim(); let m = s.match(/(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/); if (m) { const y = m[3] ? (m[3].length === 2 ? "20" + m[3] : m[3]) : TODAY.slice(0, 4); return `${y}-${z2(+m[2])}-${z2(+m[1])}`; } m = s.match(/(\d{1,2})\s*([a-z]{3})/i); if (m && months[m[2].toLowerCase()]) return `${TODAY.slice(0, 4)}-${z2(months[m[2].toLowerCase()])}-${z2(+m[1])}`; return null; };
  return text.split(/\n/).map((l) => l.trim()).filter(Boolean).filter((l) => !/^name/i.test(l)).map((line) => {
    const c = line.split(/\t|,/).map((x) => x.trim());
    const phone = (c[1] || "").replace(/\D/g, "").slice(-10);
    const paid = d(c[2]), till = d(c[3]);
    const errs = [];
    if (!c[0]) errs.push("No name");
    if (phone.length !== 10) errs.push("Phone needs 10 digits");
    if (!till) errs.push("Couldn't read the end date");
    return { name: c[0], phone: phone.replace(/(\d{5})(\d{5})/, "$1 $2"), paid, till, plan: c[4] || "Monthly", errs };
  });
}

  myQr: () => pSheet("Your check-in code", `<div style="text-align:center"><div style="display:inline-block;padding:14px;background:#fff;border-radius:20px">${qr("me" + Math.floor(Date.now() / 50000), 210)}</div><div class="p-sec" style="margin-top:8px">Show this at the desk. It refreshes every minute, so screenshots don't work.</div><button class="p-btn" style="margin-top:12px" data-a="deskScansMe">Simulate the desk scanning it</button></div>`),
  deskScansMe: () => { S.a.ciResult = doCheckin(ME, "scan"); S.a.route = "checkin"; S.p.sheet = null; toast("Desk scanned Anjali's code. See the admin's Check-in page.", "from-admin"); },

  startWk: () => { const nx = nextPlanDay(); const items = nx ? nx.day.items : [["Squat", 3, "8"], ["Push-ups", 3, "10"]]; S.p.wk = { label: nx ? nx.day.label : "Free workout", start: Date.now(), ex: items.map(([n, s, r]) => ({ name: n, target: `${s} × ${r}`, last: S.lastKg[n] || null, sets: [...Array(s)].map(() => ({ kg: "", reps: "", done: false })) })) }; S.p.route = "log"; S.p.rest = null; },
  wkTick: (d) => { const e = S.p.wk.ex[+d.e], s = e.sets[+d.s]; s.done = !s.done; if (s.done) { if (s.kg === "" && e.last) s.kg = e.last[0]; if (s.reps === "" && e.last) s.reps = e.last[1]; if (s.reps === "") s.reps = parseInt(e.target.split("×")[1]) || 10; startRestTimer(); } },
  wkAddSet: (d) => { const e = S.p.wk.ex[+d.e], last = e.sets[e.sets.length - 1]; e.sets.push({ kg: last?.kg ?? "", reps: last?.reps ?? "", done: false }); },
  restAdd: () => { S.p.rest.until += 15000; },
  restSkip: () => { S.p.rest = null; },
  wkFinish: () => { const wk = S.p.wk; let sets = 0, vol = 0; for (const e of wk.ex) for (const s of e.sets) if (s.done) { sets++; vol += (+s.kg || 0) * (+s.reps || 0); } S.history.unshift({ id: uid("wl"), day: TODAY, label: wk.label, sets, vol: Math.round(vol), mins: Math.max(1, Math.round((Date.now() - wk.start) / 60000)) }); S.p.wk = null; S.p.rest = null; S.p.route = "wkdone"; },
  wkDiscard: () => { S.p.wk = null; S.p.rest = null; S.p.route = "workouts"; },

  water: (d) => { S.food.water = S.food.water === +d.i + 1 ? +d.i : +d.i + 1; },
  addFoodSheet: (d) => { S.p.foodQuery = ""; S.p.pick = null; S.p.meal = d.m; pSheet(`Add to ${MEALS.find((x) => x[0] === d.m)[1]}`, foodSheet()); },
  pickFood: (d) => { S.p.pick = d.id ? { id: d.id, servings: 1 } : null; S.p.sheet.html = foodSheet(); },
  servings: (d) => { S.p.pick.servings = Math.max(0.5, S.p.pick.servings + +d.v); S.p.sheet.html = foodSheet(); },
  addFoodItem: () => { const f = allFoods().find((x) => x.id === S.p.pick.id), n = S.p.pick.servings; S.food.log.push({ id: uid("fl"), meal: S.p.meal, name: f.name, kcal: Math.round(f.kcal * n), p: Math.round(f.p * n), servings: n }); S.p.sheet = null; toast(`${f.name} added. Your trainer sees it.`, "from-app"); },
  quickAdd: () => { S.food.log.push({ id: uid("fl"), meal: S.p.meal, name: "Quick add", kcal: 250, p: 0, servings: 1 }); S.p.sheet = null; },
  rmFood: (d) => { S.food.log = S.food.log.filter((x) => x.id !== d.id); },

  payUpi: (d) => { const p = S.plans.find((x) => x.id === d.id); pSheet(`Pay ${inr(p.price)} by UPI`, `<div class="uz" style="border-radius:18px"><div class="p-sec" style="margin-bottom:10px">${esc(p.name)} membership. You pay ${esc(S.gym.name)} directly. No gateway fee ${usp(2)}</div><div style="display:flex;gap:12px;align-items:center" class="p-card"><div style="background:#fff;padding:6px;border-radius:12px">${qr("upi" + S.gym.upi + p.price, 96)}</div><div><div class="p-sec">UPI ID</div><b>${esc(S.gym.upi)}</b><div class="p-sec">${esc(S.gym.payee)}</div></div></div></div><button class="p-btn dark" style="margin-top:12px" data-a="pToast" data-t="Opens GPay / PhonePe / Paytm with the amount filled in.">Open UPI app</button><div class="p-sec" style="margin:14px 0 6px">After paying, enter the 12-digit UPI reference (UTR):</div><form data-submit="claimUpi" data-id="${p.id}"><input class="p-inp" name="utr" value="4${String(Date.now()).slice(-11)}" inputmode="numeric" aria-label="UPI reference"><button class="p-btn" style="margin-top:10px">I've paid</button></form>`); },
  claimUpi: (f, el) => { const p = S.plans.find((x) => x.id === el.dataset.id); S.payments.unshift({ id: uid("pay"), memberId: ME, amount: p.price, what: p.name, planId: p.id, kind: "plan", status: "created", method: "upi", at: new Date(), utr: f.utr }); S.p.sheet = null; toast("Sent to the gym. Watch it appear in the admin's Payments →", "from-app"); },
  seenReject: (d) => { S.payments.find((x) => x.id === d.id).seen = true; },

  photoSheet: () => pSheet("Profile photo", `<div class="p-sec" style="margin-bottom:8px">Your gym's team sees it, so the front desk knows it's you. Other members can't.</div><label class="p-row"><span class="ic" style="background:var(--p-muted)">${ic("camera")}</span><span class="grow"><b>Take photo</b></span><input type="file" accept="image/*" capture="user" class="sr" data-file="photo" data-id="${ME}"></label><label class="p-row"><span class="ic" style="background:var(--p-muted)">${ic("image")}</span><span class="grow"><b>Choose from gallery</b></span><input type="file" accept="image/*" class="sr" data-file="photo" data-id="${ME}"></label><button class="p-row" data-a="samplePhoto" data-id="${ME}"><span class="ic" style="background:var(--p-muted)">${ic("user")}</span><span class="grow"><b>Use a sample photo</b></span></button>${M(ME).photo ? `<button class="p-row" data-a="rmPhoto" data-id="${ME}" style="color:var(--p-danger)"><span class="ic" style="background:var(--p-muted)">${ic("trash")}</span><span class="grow"><b>Remove photo</b></span></button>` : ""}`),
  dark: (d) => { S.p.dark = d.v === "1"; },
  signOut: () => { S.p.signedOut = true; },
  signIn: () => { S.p.signedOut = false; S.p.route = "home"; toast("Signed in (a 6-digit code arrives by email)", "from-app"); },
  pJoinScreen: () => { S.p.signedOut = false; S.p.route = "join"; },
  joinGym: () => { const name = ($("#join-name")?.value || "New member").trim(); S.members.push({ id: uid("p"), name, f: false, photo: null, phone: "95440 76543", role: "member", status: "pending", joined: TODAY, notes: [] }); S.p.route = "home"; S.a.route = "members"; toast(`${name} asked to join. Approve them in the admin's Members page.`, "from-app"); },
  deleteAccount: () => pSheet("Delete your account?", `<div class="p-sec">Your name, phone, photo, workouts, body measurements and food log are deleted, and you can't sign in again. ${esc(S.gym.name)} keeps its payment and visit records as "Deleted member".</div><button class="p-btn danger" style="margin-top:14px" data-a="doDelete">Delete my account</button><button class="p-btn sec" style="margin-top:8px" data-a="pClose">Cancel</button>`),
  doDelete: () => { const m = M(ME); m.name = "Deleted member"; m.phone = ""; m.photo = null; m.status = "deleted"; S.food.log = []; S.history = []; S.p.deleted = true; S.p.sheet = null; S.wplans.forEach((w) => (w.assigned = w.assigned.filter((x) => x !== ME))); S.sessions.forEach((c) => (c.booked = c.booked.filter((x) => x !== ME))); toast("Account deleted. Payments stay in the admin as \"Deleted member\".", "from-app"); },
};

/* Form submits, typed input and toggles */
const FORMS = { addMember: A.addMember, pay: A.pay, reject: A.reject, note: A.note, comment: A.comment, sellPt: A.sellPt, cancelClass: A.cancelClass, addClass: A.addClass, addEx: A.addEx, assign: A.assign, addFood: A.addFood, addPlan: A.addPlan, claimUpi: A.claimUpi };
const INPUT = {
  memSearch: (el) => { S.a.memQuery = el.value; $("#mem-list").innerHTML = memberTable(); },
  ciSearch: (el) => { S.a.ciQuery = el.value; $("#ci-results").innerHTML = ciResults(); },
  importText: (el) => { S.a.importText = el.value; $("#import-prev").innerHTML = importPreview(); },
  wkSet: (el) => { S.p.wk.ex[+el.dataset.e].sets[+el.dataset.s][el.dataset.f] = el.value; },
  foodSearch: (el) => { S.p.foodQuery = el.value; $("#food-results").innerHTML = foodResults(); },
};
const CHANGE = {
  flag: (el) => { S.gym.f[el.dataset.k] = el.checked; toast(`${FLAG_LABELS[el.dataset.k] || el.dataset.k} ${el.checked ? "on" : "off"}. The member app updated.`, "from-admin", "sliders"); },
  simClosed: (el) => { S.gym.simulateClosed = el.checked; },
  gymField: (el) => { S.gym[el.dataset.k] = el.value; if (el.dataset.k === "name") S.gym.short = initials(el.value); },
  method: (el) => { S.gym.methods[el.dataset.k] = el.checked; },
  planActive: (el) => { S.plans.find((p) => p.id === el.dataset.k).active = el.checked; },
  planPrice: (el) => { S.plans.find((p) => p.id === el.dataset.k).price = Math.round(+el.value * 100); toast("Price updated in the app", "from-admin"); },
  role: (el) => { M(el.dataset.k).role = el.value; },
  uspHighlight: (el) => { document.body.classList.toggle("usp-on", el.checked); return false; },
};
const FLAG_LABELS = { checkin: "Check-in", classes: "Classes", workouts: "Workouts", pt: "Personal training", nutrition: "Nutrition", nutritionAll: "Nutrition for all members", selfCheckin: "App check-in", poster: "QR poster", location: "Location check", onlyOpen: "Only during opening hours", approval: "Approve new joiners" };
const allFoods = () => [...FOODS, ...S.gymFoods.map((g) => ({ ...g, ml: "", cat: "Gym" }))];
function foodResults() {
  const q = S.p.foodQuery.trim().toLowerCase();
  const list = allFoods().filter((f) => !q || f.name.toLowerCase().includes(q) || (f.ml || "").includes(q)).slice(0, 12);
  return list.map((f) => `<button class="p-row" style="padding:8px" data-a="pickFood" data-id="${f.id}"><span class="grow"><b style="font-size:13.5px">${esc(f.name)} <span class="ml">${esc(f.ml)}</span></b><small>${esc(f.serving)} · ≈${f.kcal} kcal · ${f.p} g protein</small></span>${ic("plus")}</button>`).join("") || `<div class="p-sec" style="padding:10px">No match. Use quick add.</div>`;
}
function foodSheet() {
  if (S.p.pick) {
    const f = allFoods().find((x) => x.id === S.p.pick.id), n = S.p.pick.servings;
    return `<div class="p-card" style="margin-top:8px"><b style="font-size:16px">${esc(f.name)} <span class="ml">${esc(f.ml)}</span></b><div class="p-sec">${esc(f.serving)}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><div class="stepper"><button data-a="servings" data-v="-0.5" aria-label="Less">−</button><b style="font-size:18px;min-width:30px;text-align:center">${n}</b><button data-a="servings" data-v="0.5" aria-label="More">+</button></div><div style="text-align:right"><b>≈${Math.round(f.kcal * n)} kcal</b><div class="p-sec">${Math.round(f.p * n)} g protein</div></div></div></div><button class="p-btn" style="margin-top:12px" data-a="addFoodItem">Add</button><button class="p-btn sec" style="margin-top:8px" data-a="pickFood" data-id="">Back to search</button>`;
  }
  return `<input class="p-inp" placeholder="Search puttu, appam, fish curry…" data-input="foodSearch" value="${esc(S.p.foodQuery)}" aria-label="Search foods" style="margin:8px 0"><div class="p-sec" style="margin-bottom:4px">Kerala &amp; Indian foods in home portions ${usp(7)}</div><div id="food-results">${foodResults()}</div><button class="p-btn sec sm" style="margin-top:8px" data-a="quickAdd">Quick add 250 kcal</button>`;
}

/* ---------------------------------------------------------------------------
   Guide and USP drawer
--------------------------------------------------------------------------- */
const STEPS = [
  { t: "Member checks in", d: "App → Home → Check in. The desk sees it live.", go: () => { S.p.route = "home"; S.a.route = "checkin"; } },
  { t: "Desk scans a member, sees their photo", d: "Admin → Check-in → Simulate a scan.", go: () => { S.a.route = "checkin"; } },
  { t: "Member renews with UPI, no gateway", d: "App → Pass → Pay with UPI → I've paid.", go: () => { S.p.route = "membership"; S.a.route = "payments"; } },
  { t: "Gym confirms the payment", d: "Admin → Payments → Confirm. The member gets a receipt.", go: () => { S.a.route = "payments"; S.p.route = "notifications"; } },
  { t: "Trainer coaches food & workouts", d: "Admin → Anjali → comment on food. App → Food.", go: () => { S.a.route = "member:m1"; S.p.route = "food"; } },
  { t: "Member logs a workout", d: "App → Workouts → Start workout, tick sets.", go: () => { S.p.route = "workouts"; S.a.route = "workouts"; } },
  { t: "Switch from Excel in a minute", d: "Admin → Members → Import → paste rows.", go: () => { S.a.route = "members"; A.openImport(); } },
  { t: "Turn features on and off", d: "Admin → Settings → Features. Watch the app's tabs.", go: () => { S.a.route = "settings"; S.p.route = "home"; } },
];
function renderChrome() {
  $("#drawer").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><h3>Why gyms pick GOS</h3><button class="btn ghost sm" data-a="drawer" aria-label="Close">${ic("x")}</button></div><p class="sub">The 8 things competitors don't do. Badges marked ${usp(1).replace("USP", "USP")} in the demo point at them.</p>
    <div class="pitch">Run your gym from <b>WhatsApp</b> and <b>UPI</b>: members join from one link, pay by UPI, and check in by scanning a poster. <b>No machines, no gateway fees, no data entry.</b></div>
    ${USPS.map((u) => `<div class="usp-item"><span class="n">${u.n}</span><div><b>${esc(u.t)}</b><span>${esc(u.d)}</span><div class="vs">${esc(u.vs)}</div>${Object.keys(u.go).length ? `<button data-a="goUsp" data-n="${u.n}">Show me ${ic("right")}</button>` : ""}</div></div>`).join("")}`;
  $("#guide").innerHTML = `<header data-a="guide"><span>${ic("play")} 2-minute demo script</span>${ic($("#guide").classList.contains("open") ? "down" : "left")}</header><ol>${STEPS.map((s, i) => `<li><button data-a="step" data-i="${i}"><span><b>${esc(s.t)}</b><small>${esc(s.d)}</small></span></button></li>`).join("")}</ol>`;
}

/* ---------------------------------------------------------------------------
   Render loop and events
--------------------------------------------------------------------------- */
function render() {
  const aScroll = $("#a-content")?.scrollTop ?? 0, aRoute = render.aRoute;
  const pScroll = $("#p-body")?.scrollTop ?? 0, pRoute = render.pRoute;
  renderAdmin(); renderApp();
  if (aRoute === S.a.route && $("#a-content")) $("#a-content").scrollTop = aScroll;
  if (pRoute === S.p.route && $("#p-body")) $("#p-body").scrollTop = pScroll;
  render.aRoute = S.a.route; render.pRoute = S.p.route;
  tick();
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el) { if (S.a.pop && !e.target.closest(".a-pop")) { S.a.pop = null; render(); } return; }
  if (el.tagName === "LABEL") return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (fn(el.dataset, el, e) === false) return;
  e.preventDefault();
  if (["drawer", "guide", "view", "toastOnly", "pToast"].includes(el.dataset.a)) { renderChrome(); return; }
  render(); renderChrome();
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-submit]"); if (!f) return;
  e.preventDefault();
  FORMS[f.dataset.submit](Object.fromEntries(new FormData(f)), f);
  render();
});
document.addEventListener("input", (e) => { const el = e.target.closest("[data-input]"); if (el) INPUT[el.dataset.input](el); });
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.file) {
    const file = el.files?.[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { M(el.dataset.id).photo = r.result; S.a.modal = null; S.p.sheet = null; toast("Photo saved. It shows everywhere the team sees this member."); render(); };
    r.readAsDataURL(file);
    return;
  }
  if (el.dataset.change && CHANGE[el.dataset.change]) { if (CHANGE[el.dataset.change](el) === false) return; render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { S.a.modal = null; S.p.sheet = null; S.a.pop = null; $("#drawer").classList.remove("open"); render(); } });

/* Live clocks: the workout timer and the rest countdown. */
function tick() {
  const c = $("#wk-clock");
  if (c && S.p.wk) { const s = Math.floor((Date.now() - S.p.wk.start) / 1000); c.textContent = `${Math.floor(s / 60)}:${z2(s % 60)}`; }
  const r = $("#rest-left");
  if (r && S.p.rest) { const left = Math.ceil((S.p.rest.until - Date.now()) / 1000); if (left <= 0) { S.p.rest = null; render(); toast("Rest over. Next set!", "from-app", "timer"); return; } r.textContent = `${Math.floor(left / 60)}:${z2(left % 60)}`; }
}
setInterval(tick, 1000);

if (innerWidth < 900) A.view({ v: "app" });
render(); renderChrome();
</script>
</body>
</html>
