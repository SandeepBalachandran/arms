<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Your membership, check-ins, classes, workouts and food log." />
    <!-- Installable web app (PWA): name, icons, colours, offline (sw.js). -->
    <meta name="theme-color" content="#1f2a10" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="" />
    <!-- The home-screen name: the page title, i.e. the app name from brand.json. -->
    <script>document.querySelector('meta[name="apple-mobile-web-app-title"]').content = document.title;</script>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #1f2a10;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // Chrome fires this once, early: keep it for the install banner
      // (src/components/install-banner.web.tsx).
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__gosInstallPrompt = e;
        window.dispatchEvent(new Event('gos-installable'));
      });
      // Not on the Expo dev server (port 8081), whose bundles change in place.
      if ('serviceWorker' in navigator && location.port !== '8081') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </head>

  <body>
    <!-- The installed app's animated opening screen, served by the web app (apps/web/src/app/splash.js). -->
    <script src="/splash.js"></script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
